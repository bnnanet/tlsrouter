# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - id: tlsrouter
    main: ./cmd/tlsrouter
    binary: tlsrouter
    env:
      - CGO_ENABLED=0
    goos:
      - aix
      - darwin
      - dragonfly
      - freebsd
      - illumos
      - js
      - linux
      - netbsd
      - openbsd
      - plan9
      - solaris
      - wasip1
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - loong64
      - mips
      - mips64
      - mips64le
      - mipsle
      - ppc64
      - ppc64le
      - riscv64
      - s390x
      - wasm
    goarm:
      - 6
      - 7
    goamd64:
      - v1
      - v2
      - v3
      - v4
  - id: tlsrouter-windows
    main: ./cmd/tlsrouter
    binary: tlsrouter
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - 386
      - amd64
      - arm64
    goamd64:
      - v1
      - v2
      - v3
      - v4

archives:
  - id: tlsrouter
    ids: [tlsrouter, tlsrouter-windows]
    formats: [tar.gz, tar.zst]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      tlsrouter_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ if .Amd64 }}_{{ .Amd64 }}{{ end }}
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip, tar.gz]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

checksum:
  name_template: "tlsrouter_{{ .Version }}_checksums.txt"
  disable: false

release:
  disable: false
